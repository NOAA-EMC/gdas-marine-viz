# Experiment registry for the marine LETKF verification suite.
#
# Copy this somewhere of your own, edit it, and pass it to every script. There
# is no default name: the config is always given explicitly, so a shared
# checkout of the code is never read from or written into.
#
# Add a candidate configuration by appending to `experiments`. Paths are
# relative to THIS FILE unless absolute. `stem` is a template in {Ymd}
# (YYYYMMDD) and {HH}; the suite globs for the actual filenames beneath it, so
# the t{HH}z / i006 tags in the file names do not need to be spelled out.
#
#   kind: var    -> deterministic (3DVar). Reads hofx0/hofx1, ombg, oman.
#   kind: letkf  -> ensemble. Additionally reads hofx0_*/hofx1_* members and
#                   the ensvar_prior / ensvar_post / ensmean_incr files.

# lon / lat / area / mask2d. Point this at your soca_gridspec.nc, or slim that
# ~190 MB file down to the ~7 MB the suite actually reads:
#
#   python3 make_gridfile.py --grid /path/to/soca_gridspec.nc --out lv_grid.nc
#
grid:  lv_grid.nc
reference: 3dvar_ctl    # baseline column of the scorecard

# Where output goes. `outdir` moves all four together; each can also be pinned
# individually, and --outdir / $LETKF_VERIF_OUTDIR override the lot.
# Defaults to the directory holding THIS FILE -- never the code's.
#
# outdir:    /scratch/me/letkf_verif
# cache:     {outdir}/cache
# figs:      {outdir}/figs
# report:    {outdir}/letkf_verification.html
# scorecard: {outdir}/scorecard.md

# Either an explicit list, or a {start, stop, step} range -- stop is inclusive
# and step is in hours. A week of 6-hourly cycles is:
#
# cycles:
#   start: 2026042200
#   stop:  2026042818
#   step:  6
#
cycles:                 # <- replace with your own cycle(s)
  - 2025122000

# `root` is the experiment directory; `stem` is the path beneath it holding
# one cycle's diag files. Both experiments may share a root.
experiments:
  - name:  3dvar_ctl
    label: 3DVar (tuned)
    kind:  var
    root:  /scratch/me/expts
    stem:  "gdas.{Ymd}/{HH}/analysis"

  - name:  letkf_v1
    label: LETKF v1
    kind:  letkf
    root:  /scratch/me/expts
    stem:  "enkfgdas.{Ymd}/{HH}/ensstat/analysis"
    # Ensemble variance at the three stages of the analysis. These are the
    # defaults; override only the ones your run names differently. Omitting
    # `an` (or having no such file) simply drops the inflation diagnostics.
    #
    # ensvar_patterns:
    #   prior: "*ensvar_prior.nc"     # sigma_b, background
    #   post:  "*ensvar_post.nc"      # sigma_a, analysis before inflation
    #   an:    "*an_ensvar.nc"        # sigma_an, analysis after inflation

# State variables to score. The current components u and v exist only in the
# LETKF increment and ensemble variance, so adding them gives LETKF-only
# panels -- the 3DVar column is dropped rather than left blank. ~30s of extra
# I/O per variable.
state_vars:
  ocean: [Temp, Salt, ave_ssh]
  # ocean: [Temp, Salt, ave_ssh, u, v]
  ice:   [aice_h, hi_div_aice_h, hs_div_aice_h]

# Fields read from the background; h is always read, for the depth axis. MLD
# exists only in the 3DVar history and is skipped where absent.
#
# The currents come in two forms:
#
#   speed   |(u, v)|, the magnitude   -- sequential scale
#   u, v    the components, signed    -- diverging scale, centred on zero
#
# u and v are plotted exactly as the file stores them, with no interpolation.
# Note that MOM6 history keeps them on their native faces (u on xq, v on yq)
# while soca output is at tracer points, so those columns sit half a cell
# apart -- ~14 km at the equator, below what a global map resolves. `speed`
# does collocate internally, since |(u, v)| needs both components in the same
# place to mean anything.
#
# Each costs one extra pass over u and v (~1 min per experiment per cycle);
# `speed` and the components share no work, so listing all three costs three
# passes. Drop them here if you only want the tracers.
background_vars:
  ocean: [Temp, Salt, ave_ssh, MLD, speed]
  # ocean: [Temp, Salt, ave_ssh, MLD, speed, u, v]
  ice:   [aice_h, hi_div_aice_h, hs_div_aice_h]

# Cut every depth panel at this many metres, surface at the top. Purely a view
# setting applied when plotting, so changing it needs no recompute -- the cache
# always holds the full column. Most of the signal is in the top few hundred
# metres and a linear 6000 m axis squeezes that into a sliver; this trades the
# abyss for the part you are tuning. Comment out for the full column.
#
# depth_max: 1000

# Verification against independent gridded analyses. Each product names the
# directory holding it -- everything above the YYYY/MM/file layout -- because
# these come from unrelated archives and share no common root. Relative paths
# resolve against this file. Omit the section, or give no products, to switch
# it off.
#
# A product can instead give {path: ..., pattern: ...} to override the built-in
# filename glob in lv_verif.PRODUCTS, for an archive that names files
# differently:
#
#   sst: {path: /scratch/me/OSTIA, pattern: "{Y}/{m}/{Ymd}*-OSTIA-*.nc"}
#
# Note ADT and SSS are independent of this system -- no altimetry and no
# satellite salinity are assimilated. OSTIA is built from the same AVHRR and
# VIIRS radiances the system does assimilate, so SST is a consistency check
# rather than independent validation.
verification:
  products:
    adt: /scratch/me/copernicus_adt
    sss: /scratch/me/copernicus_sss
    sst: /scratch/me/ostia

# WOA23 climatology, compared against the ocean background: an extra column on
# the background maps and sections, an extra line on the profiles, and a set of
# background-minus-WOA departure figures. Point it at the directory holding the
# 26 standard files -- woa23_decav_{t,s}00_04.nc (annual, 102 levels to 5500 m)
# and woa23_decav_{t,s}01..12_04.nc (monthly, 57 levels to 1500 m). Omit the
# block to switch it all off. Relative paths resolve against THIS file.
#
# Deliberately NOT under `verification:` above: those are same-day L4 analyses
# and every consumer of that block assumes one. This is the 1955-2022 decadal
# mean, interpolated to the cycle's day of year between the two mid-month
# fields bracketing it, spliced onto the annual field at 1500 m where the
# monthly files stop. So "model minus WOA" carries the ocean's real
# interannual anomaly as well as any model error -- read it for structure, not
# as a score.
#
# WOA distributes IN-SITU temperature while MOM6 writes POTENTIAL temperature;
# the two differ by 0.06 degC at 1000 m and 0.35 at 4000 m, which would
# otherwise dominate the deep bias. The climatology is therefore converted
# (EOS-80) before differencing. Salinity is practical in both and is not
# touched. Set potential_temperature: false only if your model writes in-situ.
#
# Costs roughly 90 s per experiment per cycle, and needs an ocean background
# (no background -> no depth axis -> no WOA). `sections: false` drops the
# vertical-section half and about 40% of that.
#
# woa:
#   path: /scratch/me/woa23
#   # pattern: 'woa23_decav_{v}{mm}_{res}.nc'   # defaults, shown for reference
#   # res: '04'                                  # 0.25 deg
#   # splice_depth: 1500
#   # potential_temperature: true
#   # sections: true

# Levels used for increment / spread maps and correlation-length fits.
map_levels: [0, 10, 30]

# Every other grid point is kept for the cached maps (1440x1080 -> 720x540).
map_stride: 2

# Vertical sections (transects) of the analysis increment and of the background
# state. `zonal` latitudes give depth-vs-longitude planes; `meridional`
# longitudes give depth-vs-latitude planes, both in conventional -180..180.
# One figure per field, with a row per transect and a column per experiment.
#
# These answer what a map at a few levels cannot: how deep an update actually
# reaches, and whether it follows the thermocline or cuts across it. Ocean 3-D
# fields only -- ave_ssh, MLD and every ice field have no vertical section and
# are skipped. Cost is one extra pass over each field's full column per
# experiment per cycle; every configured line is cut from the same level read,
# so ten lines cost the same as one. Omit the block to switch the figures off.
#
# NOTE a zonal section is a single grid ROW. On this tripolar grid the rows are
# exactly constant latitude from 78.6S to 64.4N, then bend sharply: 0.6 deg of
# latitude spread across the row at 64.5N, 6.5 deg by 68.8N, 13 deg by 73.5N.
# A zonal section north of 65N is therefore NOT a latitude circle. It is still
# drawn, but plot_statespace.py and preflight.py both warn, and the panel
# itself is marked. Meridional sections are unaffected in the same way, though
# their northern tail crosses the same bent rows.
sections:
  zonal:      [-45, -20, 0, 20, 45]
  meridional: [-150, -60, -25, 60, 150]
  # Depth views: one figure per entry, per field. The global `depth_max:` is
  # the wrong instrument for a section -- a shallow cut resolves the
  # thermocline and the bulk of the update, but an increment can reach the
  # sea floor and cropping would hide exactly that. Listing both keeps each.
  # Views share one colour scale, so a cut view is a zoom, not a recolour.
  # `full` (or omitting the key entirely) is the uncut column.
  depth_views: [1000, full]

# Fixed color-scale bounds for the state maps (background maps, and the verif
# figures for the matching model_var -- e.g. sst's model_var is Temp, so
# Temp_k0 here also bounds the SST verif figure). Fixed rather than computed
# from the cached data, so the same variable renders on the same scale across
# every cycle and every experiment -- including two experiments whose cycle
# windows never overlap, so there is no single figure a percentile could ever
# be pooled from across both. Row not listed here -> falls back to a
# percentile computed from that figure's own data, same as before this
# section existed.
#
# A [lo, hi] pair applies globally; {nh: [...], sh: [...]} applies only per
# hemisphere -- so far only sea ice thickness/snow depth need that split, since
# Arctic and Antarctic ice sit on very different scales. Adjust every bound
# below for your own fields; these are just the ones this suite happens to
# plot today.
#
# map_limits:
#   ocean:
#     Temp_k0:      [-2, 30]     # surface, degC
#     Temp_k10:     [-2, 22]
#     Temp_k30:     [-2, 12]
#     Salt_k0:      [30, 38]     # psu
#     Salt_k10:     [33, 37]
#     Salt_k30:     [33, 36]
#     ave_ssh_k0:   [-1.8, 1.2]  # m
#     MLD_k0:       [0, 200]     # m
#     speed_k0:     [0, 1.5]     # m/s
#     speed_k10:    [0, 1.0]
#     speed_k30:    [0, 0.5]
#   ice:
#     aice_h_k0:          [0, 1]                        # fraction
#     hi_div_aice_h_k0:   {nh: [0, 4],   sh: [0, 2]}     # m
#     hs_div_aice_h_k0:   {nh: [0, 0.4], sh: [0, 0.6]}   # m
#   increment:            # symmetric, +/- this value
#     ocean:
#       Temp_k0:    1.5
#       Salt_k0:    0.5
#       ave_ssh_k0: 0.2
#     ice:
#       aice_h_k0:  0.1
#   sections:             # vertical sections: keyed on the bare variable, since
#     ocean:              # a section spans the whole column, not one level
#       Temp:     [-2, 30]
#       Salt:     [30, 38]
#     increment:          # symmetric, +/- this value
#       ocean:
#         Temp:   1.5
#         Salt:   0.5

# Real ocean-basin masks (Atlantic/Pacific/Indian/Arctic/Southern), from
# RECCAP2's own open_ocean classification, as an alternative or addition to
# the hand-drawn boxes in `regions:` below. Applies everywhere a region
# applies to both state fields and observations (Grid.regions(),
# lv_obsspace.strata()) -- a basin from this mask and a `regions:` box can
# coexist under different names (e.g. the real "Atlantic" alongside a
# smaller "N_Atlantic" box used only for corr_regions, which needs an actual
# box extent a mask cannot give it). Names and codes come from the file's
# own `open_ocean.region_names` attribute, not hardcoded.
#
# ocean_basin_mask: /path/to/RECCAP2_region_masks_all.nc
#
# Regions. ONE list, used everywhere: state-space profiles, the fit to the
# gridded products, and the stratification of profile and surface observations.
# `global` is always included and never needs listing.
#
# Boxes take lat0/lat1 and optionally lon0/lon1, in conventional -180..180
# longitude; a box may straddle the dateline (lon0 > lon1). A region without
# longitude bounds is a latitude band. Observations are selected in longitude
# too wherever a region carries it.
regions:
  - {name: SH_extratropics, lat0: -90, lat1: -30}
  - {name: tropics,         lat0: -30, lat1:  30}
  - {name: NH_extratropics, lat0:  30, lat1:  90}
  - {name: N_Atlantic, lat0:  30, lat1:  60, lon0: -70,  lon1: -10}
  - {name: E_Pacific,  lat0: -10, lat1:  10, lon0: -140, lon1: -100}
  - {name: S_Ocean,    lat0: -60, lat1: -40, lon0:   0,  lon1:  40}
  - {name: Kuroshio,   lat0:  25, lat1:  45, lon0: 140,  lon1: 180}

# Which of those regions get an increment correlation-length fit. Opt-in by
# name, because the fit is per-box and means nothing globally; a region with no
# longitude bounds is not a box and is skipped.
corr_regions: [N_Atlantic, E_Pacific, S_Ocean, Kuroshio]

# Depth bins (m) for stratifying profile-observation statistics.
depth_bins: [0, 10, 50, 100, 300, 700, 2000, 6000]
