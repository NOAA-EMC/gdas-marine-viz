verification:
  products:
    adt: /scratch3/NCEPDEV/da/common/validation/copernicus_adt
    sss: /scratch3/NCEPDEV/da/common/validation/copernicus_sss
    sst: /scratch3/NCEPDEV/da/Guillaume.Vernieres/runs/gfs-dev/monitor/ostia_raw
    icec: /scratch3/NCEPDEV/da/Guillaume.Vernieres/runs/gfs-dev/monitor/ostia_raw   # OSTIA sea_ice_fraction vs aice_h

# Regional frontal-current diagnostic, staged into `figs/` by
# build_comparison.py.  `strong_speed_mps` is one absolute geostrophic-speed
# threshold per region, applied identically to Copernicus and every experiment:
# it makes locations and strength comparable without forcing broad or branching
# flows into an artificial single axis.  Axis metrics remain only where one
# coherent jet is defensible.
frontal_analysis:
  enabled: true
  adt_product: adt
  regions:
    # The frontal-grid reader is intentionally limited to 60S–60N, where the
    # separable model-grid and geostrophic approximation are well behaved.
    - {name: Global, lon: [-179.875, 179.875], lat: [-60, 60], strong_speed_mps: 0.20}
    - {name: Loop Current, lon: [-98, -80], lat: [18, 31], strong_speed_mps: 0.30}
    - {name: Gulf Stream, lon: [-98, -50], lat: [10, 45], kind: zonal, sign: 1, strong_speed_mps: 0.40, axis_diagnostic: true}
    - {name: Labrador + North Atlantic Cur., lon: [-65, -15], lat: [40, 67], kind: zonal, sign: 1, strong_speed_mps: 0.20}
    - {name: Brazil-Malvinas Currents, lon: [-65, -35], lat: [-50, -15], kind: merid, strong_speed_mps: 0.35}
    - {name: Agulhas System, lon: [5, 70], lat: [-46, -27], kind: zonal, sign: 1, strong_speed_mps: 0.25, axis_diagnostic: true}
    - {name: ACC / SAF Indian, lon: [60, 120], lat: [-52, -40], kind: zonal, sign: 1, strong_speed_mps: 0.20}
    - {name: Kuroshio, lon: [100, 180], lat: [15, 45], kind: zonal, sign: 1, strong_speed_mps: 0.40, axis_diagnostic: true}
    - {name: East Australian, lon: [140, 170], lat: [-47, -15], kind: merid, sign: -1, strong_speed_mps: 0.35}
    - {name: ACC / Drake-Scotia, lon: [-80, -10], lat: [-65, -42], kind: zonal, sign: 1, strong_speed_mps: 0.20}


map_levels: [0, 10, 30]
map_stride: 2

# Vertical sections of the increment and the background
sections:
  zonal:      [-50, -25, -5, 0, 5, 25, 50]
  meridional: [-120, -40, 20, 160]
  depth_views: [500, 1000, full]

# WOA23 climatology, compared against the ocean background. NOT a same-day
# analysis like the `verification:` products above -- it is the 1955-2022
# decadal mean, interpolated to the cycle's day of year between the two
# mid-month fields bracketing it, monthly to 1500 m and annual below. So
# "model minus WOA" carries the real interannual anomaly as well as any model
# error: read it for structure, not as a score.
#
# WOA distributes IN-SITU temperature and this model writes POTENTIAL
# temperature, so the temperature is converted (EOS-80) before differencing --
# the two differ by 0.35 degC at 4000 m, which would otherwise dominate the
# deep bias. Salinity is practical in both and needs nothing.
woa:
  path: /scratch3/NCEPDEV/da/Guillaume.Vernieres/data/woa/woa23
  # pattern: 'woa23_decav_{v}{mm}_{res}.nc'   # defaults, shown for reference
  # res: '04'
  # splice_depth: 1500
  # potential_temperature: true
  # sections: true      # the expensive half; false halves the WOA runtime

ocean_basin_mask: /scratch3/NCEPDEV/da/Guillaume.Vernieres/common/monitor_rt/sfc-verif/R2-shared-resources/data/regions/RECCAP2_region_masks_all.nc

# Fixed color-scale bounds for the state maps
map_limits:
  ocean:
    Temp_k0:      [-2, 30]     # surface, degC
    Temp_k10:     [-2, 30]     # was [-2, 22]: clipped 26% of the field
    Temp_k30:     [-2, 29]     # was [-2, 12]: clipped 41% of the field
    Salt_k0:      [29, 37.5]   # psu; plumes below 29 saturate deliberately
    Salt_k10:     [29, 37.5]   # was [33, 37]: clipped 16% at the low end
    Salt_k30:     [32, 37.5]   # was [33, 36]: clipped 13% across both ends
    ave_ssh_k0:   [-2, 0.9]    # m; was [-1.8, 1.2], 8.5% low and 1.2 unused
    MLD_k0:       [0, 300]     # m; skewed, so this still saturates ~1.5%
    speed_k0:     [0, 1.2]     # m/s; 1.5 wasted half the ramp (99th is 0.83)
    speed_k10:    [0, 1.0]
    speed_k30:    [0, 0.6]
  ice:
    aice_h_k0:          [0, 1]                         # fraction, physical
    hi_div_aice_h_k0:   {nh: [0, 4.5], sh: [0, 2]}     # m
    hs_div_aice_h_k0:   {nh: [0, 0.4], sh: [0, 0.6]}   # m
  increment:            # symmetric, +/- this value
    ocean:
      Temp_k0:    1.5
      Salt_k0:    0.5
      ave_ssh_k0: 0.2
    ice:
      aice_h_k0:  0.1
      hi_div_aice_h_k0: 0.5
      hs_div_aice_h_k0: 0.1

  # Vertical sections
  sections:
    ocean:
      Temp:     [-2, 30]
      Salt:     [30, 37.5]
      speed:    [0, 1.2]
    increment:
      ocean:
        Temp:   0.5
        Salt:   0.1

# Small boxes kept only for corr_regions (see ocean_basin_mask above) -- not
# part of the general regional breakdown, which now comes from the basins.
regions:
  - {name: N_Atlantic, lat0:  30, lat1:  60, lon0: -70,  lon1: -10}
  - {name: E_Pacific,  lat0: -10, lat1:  10, lon0: -140, lon1: -100}
  - {name: S_Ocean,    lat0: -60, lat1: -40, lon0:   0,  lon1:  40}
  - {name: Kuroshio,   lat0:  25, lat1:  45, lon0: 140,  lon1: 180}
corr_regions: [N_Atlantic, E_Pacific, S_Ocean, Kuroshio]

depth_bins: [0, 10, 50, 100, 300, 700, 2000, 6000]
